<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1200"
  height="620"
  viewBox="0 0 1200 620"
  role="img"
  aria-label="Mozuku Shadow System profile"
>
  <defs>

    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070b12"/>
      <stop offset="45%" stop-color="#04070d"/>
      <stop offset="100%" stop-color="#020409"/>
    </linearGradient>

    <linearGradient id="shell" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#060b13"/>
      <stop offset="100%" stop-color="#03060b"/>
    </linearGradient>

    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#09111c"/>
      <stop offset="100%" stop-color="#060c14"/>
    </linearGradient>

    <linearGradient id="panelSoft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1420"/>
      <stop offset="100%" stop-color="#07101a"/>
    </linearGradient>

    <linearGradient id="cyanBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#087f95"/>
      <stop offset="100%" stop-color="#00c5bb"/>
    </linearGradient>

    <linearGradient id="redBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#b72b36"/>
      <stop offset="100%" stop-color="#e0373b"/>
    </linearGradient>

    <linearGradient id="pinkBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#9a176e"/>
      <stop offset="100%" stop-color="#d22c9c"/>
    </linearGradient>

    <linearGradient id="edgeAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a8202c"/>
      <stop offset="50%" stop-color="#087f97"/>
      <stop offset="100%" stop-color="#8e1e70"/>
    </linearGradient>

    <radialGradient id="shadowPool" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.36"/>
      <stop offset="65%" stop-color="#000000" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="coldPool" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#08202a" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#08202a" stop-opacity="0"/>
    </radialGradient>

    <pattern
      id="grid"
      width="32"
      height="32"
      patternUnits="userSpaceOnUse"
    >
      <path
        d="M32 0H0V32"
        fill="none"
        stroke="#8291a7"
        stroke-width="1"
        stroke-opacity="0.012"
      />
    </pattern>

    <style>
      @keyframes breathe {
        0%, 100% { opacity: 0.68; }
        50% { opacity: 1; }
      }

      @keyframes blink {
        0%, 45% { opacity: 1; }
        50%, 95% { opacity: 0; }
        100% { opacity: 1; }
      }

      @keyframes tracer {
        from { stroke-dashoffset: 0; }
        to { stroke-dashoffset: -3600; }
      }

      @keyframes slowScan {
        0% {
          transform: translateX(-340px);
          opacity: 0;
        }
        8% {
          opacity: 0.045;
        }
        80% {
          opacity: 0.045;
        }
        100% {
          transform: translateX(1500px);
          opacity: 0;
        }
      }

      .mono {
        font-family:
          ui-monospace,
          SFMono-Regular,
          Menlo,
          Monaco,
          Consolas,
          "Liberation Mono",
          "Courier New",
          monospace;
      }

      .title {
        font-size: 27px;
        font-weight: 800;
        letter-spacing: 0.17em;
        fill: #e8edf5;
      }

      .subtitle {
        font-size: 11px;
        letter-spacing: 0.16em;
        fill: #6d809c;
      }

      .section {
        font-size: 14px;
        font-weight: 800;
        letter-spacing: 0.22em;
        fill: #3ab6c7;
      }

      .sectionRed {
        font-size: 14px;
        font-weight: 800;
        letter-spacing: 0.22em;
        fill: #d64047;
      }

      .sectionPink {
        font-size: 14px;
        font-weight: 800;
        letter-spacing: 0.22em;
        fill: #ca338f;
      }

      .label {
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.14em;
        fill: #70829d;
      }

      .value {
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.055em;
        fill: #d9e1ec;
      }

      .valueRed {
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.055em;
        fill: #e3464c;
      }

      .body {
        font-size: 11px;
        letter-spacing: 0.055em;
        fill: #98a8bd;
      }

      .bodyDim {
        font-size: 10px;
        letter-spacing: 0.055em;
        fill: #667991;
      }

      .tiny {
        font-size: 9px;
        letter-spacing: 0.075em;
        fill: #586b84;
      }

      .statLabel {
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.16em;
        fill: #aebccd;
      }

      .percent {
        font-size: 9px;
        letter-spacing: 0.08em;
        fill: #596b83;
      }

      .pill {
        font-size: 8px;
        font-weight: 800;
        letter-spacing: 0.12em;
        fill: #b8c5d5;
      }

      .footer {
        font-size: 9px;
        letter-spacing: 0.10em;
        fill: #52647c;
      }

      .breathe {
        animation: breathe 3.4s ease-in-out infinite;
      }

      .cursor {
        animation: blink 1s step-end infinite;
      }

      .tracer {
        animation: tracer 16s linear infinite;
      }

      .scanner {
        animation: slowScan 12s linear infinite;
      }
    </style>

  </defs>


