<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1200"
  height="280"
  viewBox="0 0 1200 280"
  role="img"
  aria-label="Mozuku Shadow System Activity Signal"
>
  <defs>

    <!-- ============================= -->
    <!-- BACKGROUNDS -->
    <!-- ============================= -->

    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070b12"/>
      <stop offset="50%" stop-color="#04070d"/>
      <stop offset="100%" stop-color="#020409"/>
    </linearGradient>

    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#09111c"/>
      <stop offset="100%" stop-color="#060c14"/>
    </linearGradient>

    <linearGradient id="edgeAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#962731"/>
      <stop offset="50%" stop-color="#267e8c"/>
      <stop offset="100%" stop-color="#8a286b"/>
    </linearGradient>

    <pattern
      id="grid"
      width="32"
      height="32"
      patternUnits="userSpaceOnUse"
    >
      <path
        d="M32 0H0V32"
        fill="none"
        stroke="#8292a8"
        stroke-width="1"
        stroke-opacity="0.012"
      />
    </pattern>


    <!-- ============================= -->
    <!-- ANIMATION -->
    <!-- ============================= -->

    <style>
      @keyframes breathe {
        0%, 100% { opacity: 0.58; }
        50% { opacity: 1; }
      }

      @keyframes tracer {
        from { stroke-dashoffset: 0; }
        to { stroke-dashoffset: -3200; }
      }

      @keyframes scanner {
        0% {
          transform: translateX(-120px);
          opacity: 0;
        }

        10% {
          opacity: 0.09;
        }

        85% {
          opacity: 0.09;
        }

        100% {
          transform: translateX(1200px);
          opacity: 0;
        }
      }

      @keyframes cursor {
        0%, 45% { opacity: 1; }
        50%, 95% { opacity: 0; }
        100% { opacity: 1; }
      }

      .mono {
        font-family:
          ui-monospace,
          SFMono-Regular,
          Menlo,
          Monaco,
          Consolas,
          "Liberation Mono",
          "Courier New",
          monospace;
      }

      .title {
        font-size: 18px;
        font-weight: 800;
        letter-spacing: 0.20em;
        fill: #dce4ee;
      }

      .sub {
        font-size: 9px;
        font-weight: 700;
        letter-spacing: 0.18em;
        fill: #647792;
      }

      .section {
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.20em;
        fill: #42a8b6;
      }

      .label {
        font-size: 9px;
        font-weight: 700;
        letter-spacing: 0.14em;
        fill: #71849e;
      }

      .value {
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.12em;
        fill: #a8b6c8;
      }

      .tiny {
        font-size: 8px;
        letter-spacing: 0.11em;
        fill: #576a84;
      }

      .breathe {
        animation: breathe 3s ease-in-out infinite;
      }

      .tracer {
        animation: tracer 16s linear infinite;
      }

      .scanner {
        animation: scanner 8s linear infinite;
      }

      .cursor {
        animation: cursor 1s step-end infinite;
      }
    </style>

  </defs>


  <!-- ============================= -->
  <!-- BACKGROUND -->
  <!-- ============================= -->

  <rect
    width="1200"
    height="280"
    fill="url(#bg)"
  />

  <rect
    width="1200"
    height="280"
    fill="url(#grid)"
  />


  <!-- ============================= -->
