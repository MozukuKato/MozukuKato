<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1200"
  height="150"
  viewBox="0 0 1200 150"
  role="img"
  aria-label="Mozuku Shadow System Status HUD"
>
  <defs>

    <!-- ====================================================== -->
    <!-- COLORS / GRADIENTS -->
    <!-- ====================================================== -->

    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070b12"/>
      <stop offset="50%" stop-color="#04070d"/>
      <stop offset="100%" stop-color="#020409"/>
    </linearGradient>

    <linearGradient id="inner" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#09111c"/>
      <stop offset="100%" stop-color="#060c14"/>
    </linearGradient>

    <linearGradient id="redAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a5212d"/>
      <stop offset="100%" stop-color="#df3942"/>
    </linearGradient>

    <linearGradient id="cyanAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#087f95"/>
      <stop offset="100%" stop-color="#00c6bd"/>
    </linearGradient>

    <linearGradient id="pinkAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8f1e70"/>
      <stop offset="100%" stop-color="#c83291"/>
    </linearGradient>

    <linearGradient id="edgeAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a5212d"/>
      <stop offset="50%" stop-color="#087f95"/>
      <stop offset="100%" stop-color="#8f1e70"/>
    </linearGradient>

    <pattern
      id="grid"
      width="30"
      height="30"
      patternUnits="userSpaceOnUse"
    >
      <path
        d="M30 0H0V30"
        fill="none"
        stroke="#7d8fa7"
        stroke-width="1"
        stroke-opacity="0.012"
      />
    </pattern>


    <!-- ====================================================== -->
    <!-- CSS / ANIMATION -->
    <!-- ====================================================== -->

    <style>
      @keyframes breathe {
        0%, 100% { opacity: 0.55; }
        50% { opacity: 1; }
      }

      @keyframes softBreathe {
        0%, 100% { opacity: 0.78; }
        50% { opacity: 1; }
      }

      @keyframes tracer {
        from { stroke-dashoffset: 0; }
        to { stroke-dashoffset: -2800; }
      }

      @keyframes scan {
        0% {
          transform: translateX(-240px);
          opacity: 0;
        }

        10% {
          opacity: 0.035;
        }

        85% {
          opacity: 0.035;
        }

        100% {
          transform: translateX(1350px);
          opacity: 0;
        }
      }

      @keyframes blink {
        0%, 45% { opacity: 1; }
        50%, 95% { opacity: 0; }
        100% { opacity: 1; }
      }

      .mono {
        font-family:
          ui-monospace,
          SFMono-Regular,
          Menlo,
          Monaco,
          Consolas,
          "Liberation Mono",
          "Courier New",
          monospace;
      }

      .micro {
        font-size: 9px;
        font-weight: 700;
        letter-spacing: 0.18em;
        fill: #657993;
      }

      .header {
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.24em;
      }

      .label {
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 0.18em;
        fill: #7d8ca1;
      }

      .chip {
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0.20em;
        fill: #d5deea;
      }

      .chipDark {
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0.20em;
        fill: #aebac9;
      }

      .statusBright {
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0.20em;
        fill: #e9f3fb;
      }

      .breathe {
        animation: breathe 2.4s ease-in-out infinite;
      }

      .softBreathe {
        animation: softBreathe 3.8s ease-in-out infinite;
      }

      .tracer {
        animation: tracer 13s linear infinite;
      }

      .scanner {
        animation: scan 11s linear infinite;
      }

      .cursor {
        animation: blink 1s step-end infinite;
      }
    </style>

  </defs>


  <!-- ======================================================== -->
  <!-- BACKGROUND -->
  <!-- ======================================================== -->

  <rect
    width="1200"
    height="150"
    fill="url(#bg)"
  />

  <rect
    width="1200"
    height="150"
    fill="url(#grid)"
  />


  <!-- ======================================================== -->
  <!-- MAIN SHELL -->
  <!-- ======================================================== -->

  <rect
    x="18"
    y="18"
    width="1164"
    height="114"
    rx="24"
    fill="#04070c"
    stroke="#182435"
    stroke-width="2"
  />

  <rect
    x="26"
    y="26"
    width="1148"
    height="98"
    rx="18"
    fill="url(#inner)"
    stroke="#ffffff"
    stroke-opacity="0.018"
  />


  <!-- moving perimeter signal -->

  <rect
    x="18"
    y="18"
    width="1164"
    height="114"
    rx="24"
    fill="none"
    stroke="url(#edgeAccent)"
    stroke-width="1.5"
    stroke-dasharray="105 2800"
    stroke-linecap="round"
    opacity="0.55"
    class="tracer"
  />


  <!-- subtle scan -->

  <rect
    x="-180"
    y="28"
    width="80"
    height="94"
    fill="#94a8bf"
    opacity="0.025"
    class="scanner"
  />


  <!-- ======================================================== -->
  <!-- HEADER STRIP -->
  <!-- ======================================================== -->

  <g class="mono">

    <!-- pips -->

    <circle
      cx="52"
      cy="46"
      r="4"
      fill="#21899a"
      class="breathe"
    />

    <circle
      cx="68"
      cy="46"
      r="4"
      fill="#8f2b70"
      opacity="0.75"
    />

    <circle
      cx="84"
      cy="46"
      r="4"
      fill="#b2323c"
      opacity="0.8"
    />


    <!-- name -->

    <text
      x="103"
      y="50"
      class="header"
      fill="#617590"
    >
      SHADOW_SYS
    </text>

    <text
      x="210"
      y="50"
      class="header"
      fill="#354357"
    >
      //
    </text>

    <text
      x="238"
      y="50"
      class="header"
      fill="#8898ad"
    >
      MOZUKU
    </text>


    <!-- right metadata -->

    <text
      x="916"
      y="50"
      class="micro"
    >
      INSTANCE
    </text>

    <text
      x="1003"
      y="50"
      class="micro"
      fill="#c83a43"
    >
      SHADOW
    </text>


    <circle
      cx="1127"
      cy="46"
      r="4"
      fill="#a82631"
      class="breathe"
    />

  </g>


  <!-- divider -->

  <line
    x1="46"
    y1="62"
    x2="1154"
    y2="62"
    stroke="#ffffff"
    stroke-opacity="0.035"
  />


  <!-- ======================================================== -->
  <!-- STATUS MODULES -->
  <!-- ======================================================== -->

  <g class="mono">


    <!-- ====================================================== -->
    <!-- STATUS -->
    <!-- ====================================================== -->

    <text
      x="108"
      y="98"
      class="label"
    >
      STATUS
    </text>


    <rect
      x="186"
      y="76"
      width="220"
      height="36"
      rx="12"
      fill="#080d14"
      stroke="#a5212d"
      stroke-opacity="0.62"
    />


    <!-- red edge -->

    <rect
      x="186"
      y="76"
      width="3"
      height="36"
      rx="1.5"
      fill="#c2343d"
      class="softBreathe"
    />


    <circle
      cx="210"
      cy="94"
      r="4"
      fill="#c2343d"
      class="breathe"
    />


    <text
      x="296"
      y="99"
      text-anchor="middle"
      class="statusBright"
    >
      ONLINE
    </text>



    <!-- ====================================================== -->
    <!-- MODE -->
    <!-- ====================================================== -->

    <text
      x="448"
      y="98"
      class="label"
    >
      MODE
    </text>


    <rect
      x="516"
      y="76"
      width="220"
      height="36"
      rx="12"
      fill="#070b11"
      stroke="#65758b"
      stroke-opacity="0.22"
    />


    <rect
      x="516"
      y="76"
      width="3"
      height="36"
      rx="1.5"
      fill="#48586e"
      opacity="0.65"
    />


    <circle
      cx="540"
      cy="94"
      r="4"
      fill="#60728a"
      opacity="0.55"
    />


    <text
      x="626"
      y="99"
      text-anchor="middle"
      class="chipDark"
    >
      DARK
    </text>



    <!-- ====================================================== -->
    <!-- STATE -->
    <!-- ====================================================== -->

    <text
      x="778"
      y="98"
      class="label"
    >
      STATE
    </text>


    <rect
      x="854"
      y="76"
      width="276"
      height="36"
      rx="12"
      fill="#071217"
      stroke="#087f95"
      stroke-opacity="0.62"
    />


    <rect
      x="854"
      y="76"
      width="3"
      height="36"
      rx="1.5"
      fill="#21899a"
      class="softBreathe"
    />


    <circle
      cx="878"
      cy="94"
      r="4"
      fill="#21899a"
      class="breathe"
    />


    <text
      x="992"
      y="99"
      text-anchor="middle"
      class="statusBright"
    >
      CREATION
    </text>

  </g>


  <!-- ======================================================== -->
  <!-- MICRO FOOTER DATA -->
  <!-- ======================================================== -->

  <g class="mono">

    <text
      x="48"
      y="121"
      class="micro"
    >
      NODE_02
    </text>

    <text
      x="102"
      y="121"
      class="micro"
      fill="#35475b"
    >
      /
    </text>

    <text
      x="115"
      y="121"
      class="micro"
    >
      SYS_STATE:NOMINAL
    </text>


    <text
      x="1052"
      y="121"
      class="micro"
    >
      02
    </text>

    <text
      x="1081"
      y="121"
      class="micro cursor"
      fill="#21899a"
    >
      █
    </text>

  </g>

</svg>
